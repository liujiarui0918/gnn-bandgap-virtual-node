experiment_name: E5_ALIGNN_transformer
runner: alignn
seed: 42
data:
  dataset_root: data/official_dataset
  cache_dir: data/official_dataset/alignn_cache
  local_cache_root: /root/lanyun-tmp/gnn_alignn_cache
  cutoff: 8.0
  cutoff_extra: 3.0
  max_neighbors: 12
  use_lmdb: true
training:
  device: auto
  batch_size: 40
  test_batch_size: 40
  epochs: 50
  optimizer: adamw
  lr: 0.0007
  weight_decay: 0.00005
  scheduler: onecycle
  onecycle_max_lr: 0.0007
  mixed_precision: false
  pin_memory: true
  num_workers: 0
  grad_clip_norm: 5.0
model:
  runner_name: ALIGNN_Transformer
  variant: transformer
  alignn_layers: 4
  gcn_layers: 4
  atom_input_features: 92
  edge_input_features: 80
  triplet_input_features: 40
  embedding_features: 64
  hidden_features: 256
  output_features: 1
  link: identity
  transformer_layers: 3
  attention_heads: 8
  ffn_hidden_features: 768
  position_frequencies: 12
  radial_frequencies: 8
  dropout: 0.08
  transformer_layerscale_init: 0.001
  global_residual_init: 0.15
