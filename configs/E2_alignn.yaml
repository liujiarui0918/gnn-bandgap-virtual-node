experiment_name: E2_ALIGNN_baseline
seed: 42
data:
  processed_dir: data/processed
training:
  device: auto
  batch_size: 64
  epochs: 50
  optimizer: adamw
  lr: 0.001
  weight_decay: 0.00001
  scheduler: onecycle
  onecycle_max_lr: 0.001
  early_stopping_patience: 10
  mixed_precision: true
  pin_memory: true
  num_workers: 0
  metal_threshold: 0.1
  grad_clip_norm: 5.0
  loss: mse
model:
  name: alignn
  cutoff: 8.0
  max_neighbors: 12
  edge_basis_dim: 41
  angle_basis_dim: 24
  hidden_dim: 256
  edge_hidden_dim: 128
  num_layers: 4
  graph_feature_dim: 8
  dropout: 0.1

