experiment_name: E10_ALIGNN_sizeaware_virtualnode_active
runner: alignn
seed: 42
data:
  dataset_root: data/official_dataset
  cache_dir: data/official_dataset/alignn_cache
  local_cache_root: /root/lanyun-tmp/gnn_alignn_cache
  cutoff: 8.0
  cutoff_extra: 3.0
  max_neighbors: 12
  use_lmdb: true
training:
  device: auto
  batch_size: 56
  test_batch_size: 56
  epochs: 50
  optimizer: adamw
  lr: 0.001
  weight_decay: 0.00001
  scheduler: onecycle
  onecycle_max_lr: 0.001
  mixed_precision: false
  pin_memory: true
  num_workers: 0
  grad_clip_norm: 5.0
model:
  runner_name: ALIGNN_SizeAwareVirtualNode_Active
  variant: sizeawarevirtualnode
  alignn_layers: 4
  gcn_layers: 4
  atom_input_features: 92
  edge_input_features: 80
  triplet_input_features: 40
  embedding_features: 64
  hidden_features: 256
  output_features: 1
  link: identity
  attention_heads: 4
  dropout: 0.08
  slot2_residual_init: 0.25
  fusion_residual_init: 0.2
  gate_bias_init: -1.0
  slot2_min_scale: 0.02
  slot2_max_scale: 0.35
  fusion_min_scale: 0.15
  fusion_max_scale: 0.55
  size_prior_threshold: 48.0
  size_prior_temperature: 18.0
