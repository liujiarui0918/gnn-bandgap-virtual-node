<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155" />
    </marker>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 600 18px Arial, sans-serif; fill: #475569; }
      .label { font: 600 18px Arial, sans-serif; fill: #0f172a; }
      .small { font: 500 15px Arial, sans-serif; fill: #334155; }
      .tiny { font: 500 13px Arial, sans-serif; fill: #475569; }
      .note { font: 700 16px Arial, sans-serif; fill: #991b1b; }
      .box { stroke: #334155; stroke-width: 2; rx: 18; ry: 18; }
      .flow { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .soft { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 8 6; }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="980" fill="#f8fafc" />
  <text x="60" y="60" class="title">E12 ALIGNN Size-Supervised Dual-Slot Virtual Node</text>
  <text x="60" y="92" class="subtitle">Forward path is dual-slot ALIGNN. Size signal is used only in training loss, not as a forward gate input.</text>

  <rect x="60" y="140" width="220" height="120" class="box" fill="#dbeafe" />
  <text x="90" y="180" class="label">Input Crystal</text>
  <text x="90" y="210" class="small">pymatgen Structure</text>
  <text x="90" y="236" class="small">periodic lattice + atoms</text>

  <rect x="340" y="140" width="290" height="120" class="box" fill="#e0f2fe" />
  <text x="370" y="180" class="label">Graph Builder</text>
  <text x="370" y="210" class="small">atom graph + line graph</text>
  <text x="370" y="236" class="small">bond lengths + bond angles</text>

  <rect x="690" y="140" width="360" height="120" class="box" fill="#dcfce7" />
  <text x="720" y="180" class="label">ALIGNN Encoder Inputs</text>
  <text x="720" y="210" class="small">atom embedding</text>
  <text x="720" y="236" class="small">edge embedding from bond length</text>
  <text x="720" y="262" class="small">angle embedding from line graph</text>

  <path d="M280 200 L340 200" class="flow" />
  <path d="M630 200 L690 200" class="flow" />

  <rect x="1110" y="110" width="420" height="180" class="box" fill="#fef3c7" />
  <text x="1140" y="150" class="label">Gate Network</text>
  <text x="1140" y="180" class="small">input: graph mean of initial node embeddings</text>
  <text x="1140" y="206" class="small">MLP -&gt; 2 logits</text>
  <text x="1140" y="232" class="small">sigmoid -&gt; slot2_enable, global_fusion_strength</text>
  <text x="1140" y="258" class="note">E12: no size features in forward gate</text>

  <path d="M1050 200 L1110 200" class="flow" />

  <rect x="60" y="340" width="1470" height="350" class="box" fill="#ffffff" />
  <text x="90" y="380" class="label">Backbone</text>
  <text x="90" y="408" class="small">4 ALIGNN layers + 4 GCN layers</text>
  <text x="90" y="434" class="small">Gate values are computed once from the initial graph embedding and reused through all layers.</text>

  <rect x="110" y="470" width="360" height="160" class="box" fill="#dbeafe" />
  <text x="140" y="510" class="label">Primary Virtual Slot</text>
  <text x="140" y="538" class="small">always on</text>
  <text x="140" y="564" class="small">node += primary_slot[graph]</text>
  <text x="140" y="590" class="small">mean-pool nodes -&gt; update primary slot</text>

  <rect x="560" y="450" width="470" height="200" class="box" fill="#fde68a" />
  <text x="590" y="490" class="label">Secondary Attentive Slot</text>
  <text x="590" y="518" class="small">node injection is scaled by slot2_enable</text>
  <text x="590" y="544" class="small">secondary slot attends to padded node tokens</text>
  <text x="590" y="570" class="small">MultiheadAttention(query = slot2, key/value = nodes)</text>
  <text x="590" y="596" class="small">slot2 update is also scaled by slot2_enable</text>
  <text x="590" y="622" class="small">goal: add extra global capacity only when useful</text>

  <rect x="1110" y="470" width="360" height="160" class="box" fill="#dcfce7" />
  <text x="1140" y="510" class="label">Shared Message Passing</text>
  <text x="1140" y="538" class="small">ALIGNN layer:</text>
  <text x="1140" y="564" class="small">node, edge, angle updates</text>
  <text x="1140" y="596" class="small">GCN layer:</text>
  <text x="1140" y="622" class="small">node, edge updates</text>

  <path d="M1210 290 L1210 430" class="soft dashed" />
  <path d="M1210 430 L975 430 L975 450" class="soft dashed" />
  <path d="M1210 430 L1290 430 L1290 470" class="soft dashed" />

  <path d="M470 550 L560 550" class="flow" />
  <path d="M1030 550 L1110 550" class="flow" />
  <path d="M1290 630 L1290 680" class="flow" />

  <rect x="280" y="740" width="1040" height="120" class="box" fill="#ede9fe" />
  <text x="310" y="780" class="label">Readout and Fusion</text>
  <text x="310" y="808" class="small">pooled nodes + primary_slot -&gt; base_features</text>
  <text x="310" y="834" class="small">pooled nodes + primary_slot + scaled secondary_slot -&gt; secondary_features</text>
  <text x="310" y="860" class="small">fused = base_features + global_fusion_strength * fusion_gate * secondary_features</text>

  <rect x="1360" y="740" width="170" height="120" class="box" fill="#fecaca" />
  <text x="1395" y="790" class="label">Output Head</text>
  <text x="1395" y="820" class="small">band_gap</text>

  <path d="M1320 800 L1360 800" class="flow" />

  <rect x="60" y="760" width="180" height="120" class="box" fill="#fee2e2" />
  <text x="90" y="800" class="label">Training Only</text>
  <text x="90" y="828" class="small">size supervision</text>
  <text x="90" y="854" class="small">does not enter forward</text>

  <path d="M240 820 L280 820" class="flow" />

  <rect x="60" y="900" width="1470" height="50" class="box" fill="#fef2f2" />
  <text x="90" y="932" class="small">Loss(E12) = MSE(band_gap_pred, band_gap_target) + lambda_size * BCE(slot2_gate_logit, sigmoid((num_atoms - 80) / 18))</text>
</svg>
