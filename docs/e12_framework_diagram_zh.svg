<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155" />
    </marker>
    <style>
      .title { font: 700 28px 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 600 18px 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', Arial, sans-serif; fill: #475569; }
      .label { font: 600 18px 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', Arial, sans-serif; fill: #0f172a; }
      .small { font: 500 15px 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', Arial, sans-serif; fill: #334155; }
      .note { font: 700 16px 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', Arial, sans-serif; fill: #991b1b; }
      .box { stroke: #334155; stroke-width: 2; rx: 18; ry: 18; }
      .flow { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .soft { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 8 6; }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="980" fill="#f8fafc" />
  <text x="60" y="60" class="title">E12 ALIGNN 尺度监督双槽位虚拟节点框架</text>
  <text x="60" y="92" class="subtitle">前向路径仍是双槽位 ALIGNN；结构尺度只进入训练损失，不直接作为前向 gate 输入。</text>

  <rect x="60" y="140" width="220" height="120" class="box" fill="#dbeafe" />
  <text x="90" y="180" class="label">输入晶体</text>
  <text x="90" y="210" class="small">pymatgen Structure</text>
  <text x="90" y="236" class="small">周期晶格 + 原子</text>

  <rect x="340" y="140" width="290" height="120" class="box" fill="#e0f2fe" />
  <text x="370" y="180" class="label">构图模块</text>
  <text x="370" y="210" class="small">原子图 + 线图</text>
  <text x="370" y="236" class="small">键长 + 键角</text>

  <rect x="690" y="140" width="360" height="120" class="box" fill="#dcfce7" />
  <text x="720" y="180" class="label">ALIGNN 编码输入</text>
  <text x="720" y="210" class="small">原子嵌入</text>
  <text x="720" y="236" class="small">边嵌入（由键长得到）</text>
  <text x="720" y="262" class="small">角嵌入（由线图得到）</text>

  <path d="M280 200 L340 200" class="flow" />
  <path d="M630 200 L690 200" class="flow" />

  <rect x="1110" y="110" width="420" height="180" class="box" fill="#fef3c7" />
  <text x="1140" y="150" class="label">门控网络</text>
  <text x="1140" y="180" class="small">输入：初始节点嵌入的图级均值</text>
  <text x="1140" y="206" class="small">MLP -&gt; 2 个 logit</text>
  <text x="1140" y="232" class="small">sigmoid -&gt; slot2_enable / global_fusion_strength</text>
  <text x="1140" y="258" class="note">E12：前向 gate 不显式喂 num_atoms</text>

  <path d="M1050 200 L1110 200" class="flow" />

  <rect x="60" y="340" width="1470" height="350" class="box" fill="#ffffff" />
  <text x="90" y="380" class="label">主干网络</text>
  <text x="90" y="408" class="small">4 层 ALIGNN + 4 层 GCN</text>
  <text x="90" y="434" class="small">门控值只基于初始图表示计算一次，随后贯穿所有层复用。</text>

  <rect x="110" y="470" width="360" height="160" class="box" fill="#dbeafe" />
  <text x="140" y="510" class="label">主虚拟槽位</text>
  <text x="140" y="538" class="small">始终开启</text>
  <text x="140" y="564" class="small">node += primary_slot[graph]</text>
  <text x="140" y="590" class="small">节点均值池化后更新主槽位</text>

  <rect x="560" y="450" width="470" height="200" class="box" fill="#fde68a" />
  <text x="590" y="490" class="label">次虚拟槽位（注意力槽位）</text>
  <text x="590" y="518" class="small">注入节点时受 slot2_enable 缩放</text>
  <text x="590" y="544" class="small">slot2 对填充后的节点 token 做注意力</text>
  <text x="590" y="570" class="small">MultiheadAttention：query=slot2，key/value=nodes</text>
  <text x="590" y="596" class="small">自身更新同样受 slot2_enable 缩放</text>
  <text x="590" y="622" class="small">目标：只在确实有用时增加额外全局容量</text>

  <rect x="1110" y="470" width="360" height="160" class="box" fill="#dcfce7" />
  <text x="1140" y="510" class="label">共享消息传递</text>
  <text x="1140" y="538" class="small">ALIGNN 层：</text>
  <text x="1140" y="564" class="small">节点、边、角更新</text>
  <text x="1140" y="596" class="small">GCN 层：</text>
  <text x="1140" y="622" class="small">节点、边更新</text>

  <path d="M1210 290 L1210 430" class="soft dashed" />
  <path d="M1210 430 L975 430 L975 450" class="soft dashed" />
  <path d="M1210 430 L1290 430 L1290 470" class="soft dashed" />

  <path d="M470 550 L560 550" class="flow" />
  <path d="M1030 550 L1110 550" class="flow" />
  <path d="M1290 630 L1290 680" class="flow" />

  <rect x="280" y="740" width="1040" height="132" class="box" fill="#ede9fe" />
  <text x="310" y="780" class="label">读出与融合</text>
  <text x="310" y="806" class="small">pooled nodes + primary_slot -&gt; base_features</text>
  <text x="310" y="832" class="small">pooled nodes + primary_slot + scaled secondary_slot -&gt; secondary_features</text>
  <text x="310" y="858" class="small">fused = base_features + global_fusion_strength * fusion_gate * secondary_features</text>

  <rect x="1360" y="740" width="170" height="120" class="box" fill="#fecaca" />
  <text x="1395" y="790" class="label">输出头</text>
  <text x="1395" y="820" class="small">band_gap</text>

  <path d="M1320 800 L1360 800" class="flow" />

  <rect x="60" y="760" width="180" height="120" class="box" fill="#fee2e2" />
  <text x="90" y="800" class="label">仅训练期</text>
  <text x="90" y="828" class="small">尺度监督</text>
  <text x="90" y="854" class="small">不进入前向</text>

  <path d="M240 820 L280 820" class="flow" />

  <rect x="60" y="900" width="1470" height="50" class="box" fill="#fef2f2" />
  <text x="90" y="932" class="small">Loss(E12) = MSE(band_gap_pred, band_gap_target) + λ_size * BCE(slot2_gate_logit, sigmoid((num_atoms - 80) / 18))</text>
</svg>
